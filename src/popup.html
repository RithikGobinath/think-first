<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Think First</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="tf-header">
      <h1>Think First</h1>
      <label class="tf-toggle">
        <input type="checkbox" id="enabled" />
        <span class="tf-toggle-track"></span>
      </label>
    </header>

    <section class="tf-section">
      <div class="tf-row">
        <label for="waitMs">Wait before you can move (seconds)</label>
        <input type="number" id="waitMs" min="3" max="30" step="1" class="tf-textbox tf-textbox-inline" />
      </div>
    </section>

    <section class="tf-section">
      <div class="tf-row">
        <label for="clockMode">When my clock runs low</label>
      </div>
      <!-- Radio group, not a <select>: a native select's dropdown list
           reliably closes the extension popup the instant it opens on
           Chrome (a longstanding bug with <select> inside action popups),
           which made this control look completely unresponsive. -->
      <div class="tf-radio-group" role="radiogroup" aria-label="When my clock runs low">
        <label class="tf-radio">
          <input type="radio" name="clockMode" value="fixed" />
          Skip the wait below threshold
        </label>
        <label class="tf-radio">
          <input type="radio" name="clockMode" value="scaled" />
          Shrink the wait as time drops
        </label>
      </div>

      <div class="tf-row tf-row-tight">
        <label for="bypassBelowSec">Threshold (seconds remaining)</label>
        <input type="number" id="bypassBelowSec" min="0" max="120" />
      </div>

      <div class="tf-row tf-row-tight" id="scaleDivisorRow">
        <label for="scaleDivisor">Scale divisor</label>
        <input type="number" id="scaleDivisor" min="1" max="60" />
      </div>
    </section>

    <section class="tf-section">
      <label class="tf-checkbox">
        <input type="checkbox" id="showSkipButton" />
        Show a skip-wait button on the board
      </label>
      <label class="tf-checkbox">
        <input type="checkbox" id="onComputer" />
        Apply against the computer (/play/computer)
      </label>
      <label class="tf-checkbox">
        <input type="checkbox" id="onOnline" />
        Apply in live/online games
      </label>
      <label class="tf-checkbox">
        <input type="checkbox" id="blockPremoveIntoLock" />
        Block premoves (disables the board for the opponent's whole turn - the only way to stop a premove from skipping the wait entirely)
      </label>
    </section>

    <section class="tf-section">
      <div class="tf-row">
        <label for="skipKeyInput">Skip-wait shortcut</label>
      </div>
      <input type="text" id="skipKeyInput" class="tf-textbox" readonly placeholder="Click, then press a key" />
    </section>

    <section class="tf-section tf-stats">
      <div class="tf-stat">
        <span class="tf-stat-value" id="statLocks">0</span>
        <span class="tf-stat-label">locks served</span>
      </div>
      <div class="tf-stat">
        <span class="tf-stat-value" id="statSkips">0</span>
        <span class="tf-stat-label">skips</span>
      </div>
      <div class="tf-stat">
        <span class="tf-stat-value" id="statWaited">0s</span>
        <span class="tf-stat-label">spent thinking</span>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
